# Colours are generated from ~/.config/deathcastle/palette
include deathcastle.conf

# Look
background_opacity 0.90
window_padding_width 8
font_size 11.0
cursor_shape block
cursor_blink_interval 0

# Tabs: thin, at the bottom, same style as the bar
tab_bar_edge bottom
tab_bar_style separator
tab_separator " "
tab_title_template " {index}: {title} "

# Behaviour
enable_audio_bell no
scrollback_lines 10000
confirm_os_window_close 0
