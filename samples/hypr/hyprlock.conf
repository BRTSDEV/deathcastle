# DEATHCASTLE lock screen. Colours come from ~/.config/deathcastle/palette
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    blur_passes = 2
    blur_size = 6
}

label {
    monitor =
    text = cmd[update:1000] date +"[%H:%M]"
    color = $fg
    font_size = 48
    font_family = $font Bold
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 44
    rounding = 0
    outline_thickness = 2
    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    font_family = $font Bold
    check_color = $accent
    fail_color = $amber
    capslock_color = $amber
    placeholder_text = [PASSWORD]
    fail_text = [WRONG]
    fade_on_empty = false
    position = 0, 0
    halign = center
    valign = center
}
