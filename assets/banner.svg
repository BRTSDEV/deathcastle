<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="DEATHCASTLE: a dark slate blue desktop theme for Hyprland">
  <title>DEATHCASTLE</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232a31"/><stop offset="1" stop-color="#11161c"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#a9c1cf" stop-opacity=".55"/><stop offset=".55" stop-color="#7e929d" stop-opacity=".2"/><stop offset="1" stop-color="#7e929d" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#d5dee6"/><stop offset=".6" stop-color="#a9c1cf"/><stop offset="1" stop-color="#7e929d"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a9c1cf"/><stop offset="1" stop-color="#a9c1cf" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="lit" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <clipPath id="reveal"><rect x="0" y="90" width="640" height="130"><animate attributeName="width" from="0" to="640" dur="1.6s" calcMode="spline" keySplines=".2 .7 .2 1" keyTimes="0;1"/></rect></clipPath>
  </defs>
  <style>
    .star { fill: #d5dee6; animation: twinkle 4s ease-in-out infinite; }
    .s2 { animation-delay: -1.1s; animation-duration: 5.5s; } .s3 { animation-delay: -2.3s; animation-duration: 3.4s; } .s4 { animation-delay: -3.2s; animation-duration: 6.2s; }
    .halo { transform-origin: 930px 190px; animation: breathe 7s ease-in-out infinite; }
    .mist { animation: drift 26s ease-in-out infinite alternate; } .m2 { animation-duration: 38s; animation-direction: alternate-reverse; }
    .win { fill: #e0b060; animation: flicker 5s steps(1) infinite; }
    .w2 { animation-delay: -1.3s; animation-duration: 7s; } .w3 { animation-delay: -2.9s; animation-duration: 4.2s; } .w4 { animation-delay: -3.7s; animation-duration: 8.5s; }
    .cursor { fill: #e0b060; animation: blink 1.1s steps(1) infinite; }
    .title { font: 800 78px 'JetBrains Mono','DejaVu Sans Mono','Menlo','Consolas',monospace; fill: #d5dee6; letter-spacing: 1px; }
    .sub { font: 600 21px 'JetBrains Mono','DejaVu Sans Mono','Menlo','Consolas',monospace; fill: #a9c1cf; }
    .tag { font: 600 15px 'JetBrains Mono','DejaVu Sans Mono','Menlo','Consolas',monospace; fill: #7e929d; letter-spacing: 1.5px; }
    @keyframes twinkle { 0%,100% { opacity: .85; } 50% { opacity: .15; } }
    @keyframes breathe { 0%,100% { opacity: .7; transform: scale(.97); } 50% { opacity: 1; transform: scale(1.05); } }
    @keyframes drift { from { transform: translateX(-70px); } to { transform: translateX(90px); } }
    @keyframes flicker { 0%,100% { opacity: 1; } 43% { opacity: .45; } 46% { opacity: 1; } 71% { opacity: .65; } 73% { opacity: 1; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1280" height="420" fill="url(#sky)"/>
  <g>
    <circle class="star" cx="64" cy="42" r="1.4"/><circle class="star s2" cx="212" cy="74" r="1"/><circle class="star s3" cx="344" cy="34" r="1.6"/>
    <circle class="star s4" cx="486" cy="62" r="1"/><circle class="star s2" cx="596" cy="30" r="1.3"/><circle class="star" cx="692" cy="84" r="1"/>
    <circle class="star s3" cx="736" cy="36" r="1.5"/><circle class="star s4" cx="1148" cy="40" r="1.3"/><circle class="star s2" cx="1226" cy="96" r="1"/>
    <circle class="star s3" cx="1198" cy="168" r="1.2"/><circle class="star" cx="118" cy="266" r="1"/><circle class="star s4" cx="660" cy="148" r="1.1"/>
  </g>

  <circle class="halo" cx="930" cy="190" r="270" fill="url(#glow)"/>
  <circle cx="930" cy="190" r="150" fill="url(#moon)"/>
  <g fill="#7e929d" opacity=".42">
    <circle cx="868" cy="118" r="17"/><circle cx="986" cy="96" r="24"/><circle cx="1038" cy="172" r="15"/><circle cx="846" cy="196" r="11"/><circle cx="924" cy="154" r="8"/>
  </g>

  <path d="M0 420V338L150 300 318 342 492 296 640 346 780 306 1010 300 1120 244 1190 276 1280 226V420Z" fill="#232a31"/>
  <ellipse class="mist" cx="400" cy="340" rx="340" ry="17" fill="#7e929d" opacity=".2" filter="url(#soft)"/>

  <!-- Castle -->
  <g fill="#11161c">
    <path d="M802 262h26v62h-26z"/><path d="M797 263l18-23 18 23z"/>
    <path d="M840 196h46v130h-46z"/><path d="M832 197l31-45 31 45z"/>
    <path d="M886 234h96v92h-96z"/><path d="M880 235l14-23h86l12 23z"/>
    <path d="M982 186h56v140h-56z"/><path d="M972 187l38-53 38 53z"/>
    <path d="M1038 244h18v82h-18z"/>
  </g>
  <g stroke="#232a31" stroke-width="1.5" fill="none" opacity=".9"><path d="M840 196h46M982 186h56M886 234h96"/></g>
  <g filter="url(#lit)" opacity=".75">
    <rect class="win" x="858" y="212" width="5" height="10"/><rect class="win w3" x="1006" y="204" width="7" height="14"/><rect class="win w2" x="920" y="262" width="4" height="8"/>
  </g>
  <rect class="win" x="858" y="212" width="5" height="10"/><rect class="win w2" x="873" y="212" width="4" height="9"/>
  <rect class="win w4" x="900" y="262" width="4" height="8"/><rect class="win w2" x="920" y="262" width="4" height="8"/>
  <rect class="win w3" x="948" y="262" width="4" height="8"/><rect class="win w3" x="1006" y="204" width="7" height="14"/>
  <rect class="win w4" x="1024" y="252" width="4" height="9"/><rect class="win" x="812" y="280" width="4" height="8"/>

  <path d="M0 420V384L120 366 260 386 420 362 590 386 712 352 800 318 866 330 950 310 1056 322 1150 358 1280 342V420Z" fill="#11161c"/>
  <ellipse class="mist m2" cx="940" cy="352" rx="310" ry="15" fill="#a9c1cf" opacity=".16" filter="url(#soft)"/>

  <!-- Title -->
  <g clip-path="url(#reveal)"><text class="title" x="64" y="186">DEATHCASTLE</text></g>
  <rect class="cursor" x="622" y="128" width="20" height="62"/>
  <rect x="66" y="208" width="420" height="3" fill="url(#fade)"/>
  <text class="sub" x="66" y="248">A dark slate blue desktop theme</text>
  <text class="sub" x="66" y="278">for Hyprland, born from one moonlit wallpaper.</text>
  <text class="tag" x="66" y="322">ONE PALETTE  /  EVERY APP  /  HARD CORNERS</text>
</svg>
