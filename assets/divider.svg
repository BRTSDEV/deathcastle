<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 18" width="1280" height="18" role="presentation">
  <defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7e929d" stop-opacity="0"/><stop offset=".5" stop-color="#7e929d"/><stop offset="1" stop-color="#7e929d" stop-opacity="0"/></linearGradient></defs>
  <style>
    .spark { animation: travel 7s ease-in-out infinite alternate; }
    @keyframes travel { from { transform: translateX(240px); } to { transform: translateX(1032px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .spark { transform: translateX(636px); } }
  </style>
  <rect y="8" width="1280" height="2" fill="url(#line)"/>
  <rect class="spark" y="5" width="8" height="8" fill="#e0b060"/>
</svg>
